<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aaron The Carter NEW.... Official Website!</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    @font-face {
      font-family: 'SonicFont';
      src: url('sonic-2-system.otf') format('opentype');
    }

    body {
      margin: 0;
      font-family: 'SonicFont', Arial, sans-serif;
      background: linear-gradient(135deg, orange, #ff6600);
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    header {
      padding: 40px 20px;
    }

    h1 {
      margin: 10px 0 0;
      font-size: 2rem;
      font-weight: normal;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .logo {
      width: 120px;
      height: auto;
      animation: bounce 1.5s infinite;
    }

    .yt-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 40px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .yt-logo {
      width: 100px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .yt-logo:hover {
      transform: scale(1.1);
    }

    .yt-logo:active {
      transform: scale(0.95);
    }

    .button-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    #gameBtn,
    #comicBtn,
    #forsakenBtn {
      cursor: pointer;
      width: 250px;
      transition: transform 0.2s ease;
    }

    #gameBtn:hover,
    #comicBtn:hover,
    #forsakenBtn:hover {
      transform: scale(1.1);
    }

    #gameBtn:active,
    #comicBtn:active,
    #forsakenBtn:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <header>
    <img src="mainlogo.png" alt="Main Logo" class="logo" />
    <h1>welcome to my site</h1>

    <button onclick="toggleMusic()">Music Toggle</button>

    <audio id="bgMusic" loop>
      <source src="bg.mp3" type="audio/mpeg">
    </audio>

    <audio id="ringSound">
      <source src="ring.wav" type="audio/wav">
    </audio>

    <audio id="comicMusic">
      <source src="Maigo - Springless - Topic (128k).mp3" type="audio/mpeg">
    </audio>

    <audio id="forsakenSound">
      <source src="specialscaryringsound.wav" type="audio/wav">
    </audio>
  </header>

  <main>
    <p>my name is Aaron Carter, i make games, animations and most importantly content!.</p>

    <div class="yt-container">
      <a href="https://www.youtube.com/@aaronthecarterreal" target="_blank" onclick="playRing()">
        <img src="ytlogo.png" class="yt-logo" />
      </a>

      <a href="https://bsky.app/profile/aaronthecarter.bsky.social" target="_blank" onclick="playRing()">
        <img src="Bluesky_Logo_White.svg.png" class="yt-logo" />
      </a>

      <a href="mailto:aaronthecarter37@gmail.com" target="_blank" onclick="playRing()">
        <img src="Gmail_Logo_White_512px.png" class="yt-logo" />
      </a>

      <img src="BUY MY MERCH COMING SOON!.png" class="yt-logo" />
    </div>

    <div class="button-row">
      <img src="buttonye.png" id="gameBtn" />
      <img src="Untitled188_20260702190649.png" id="comicBtn" />
      <img src="Untitled192_20260704111824.png" id="forsakenBtn" />
    </div>
  </main>

  <script>
    function toggleMusic() {
      const music = document.getElementById("bgMusic");
      if (music.paused) music.play();
      else music.pause();
    }

    function playRing() {
      const ring = document.getElementById("ringSound");
      ring.currentTime = 0;
      ring.play();
    }

    function playForsakenSound() {
      const sound = document.getElementById("forsakenSound");
      sound.currentTime = 0;
      sound.play();
    }

    document.getElementById("gameBtn").onclick = () => {
      playRing();
      window.open("https://gamejolt.com/games/SonicTheHedgehogOrdeal/1059371", "_blank");
    };

    document.getElementById("comicBtn").onclick = () => {
      playRing();
      const music = document.getElementById("comicMusic");
      music.currentTime = 0;
      music.play();
      window.open("Aaron%20The%20Carter%20(Issue%20%231)%20%5BWebsite%20Version%5D.pdf", "_blank");
    };

    document.getElementById("forsakenBtn").onclick = () => {
      playForsakenSound();
      window.open("https://www.roblox.com/share?code=c6254fadabdb2545bde4d3f6e8d85929&type=ExperienceDetails&stamp=1783135263438", "_blank");
    };
  </script>

</body>
</html>
