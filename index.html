<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aaron The Carter NEW.... Official Website!</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    @font-face {
      font-family: 'SonicFont';
      src: url('sonic-2-system.otf') format('opentype');
    }

    body {
      margin: 0;
      font-family: 'SonicFont', Arial, sans-serif;
      background: linear-gradient(135deg, orange, #ff6600);
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    header {
      padding: 40px 20px;
    }

    h1 {
      margin: 10px 0 0;
      font-size: 2rem;
      font-weight: normal;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .logo {
      width: 120px;
      height: auto;
      animation: bounce 1.5s infinite;
    }

    .yt-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 40px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .yt-logo {
      width: 100px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .yt-logo:hover {
      transform: scale(1.1);
    }

    .yt-logo:active {
      transform: scale(0.95);
    }

    #musicBtn {
      margin-top: 20px;
      padding: 10px 15px;
      background: rgba(0,0,0,0.3);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.2s ease;
    }

    #musicBtn:hover {
      transform: scale(1.05);
    }

    .button-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    #gameBtn,
    #comicBtn {
      cursor: pointer;
      width: 250px;
      transition: transform 0.2s ease;
    }

    #gameBtn:hover,
    #comicBtn:hover {
      transform: scale(1.1);
    }

    #gameBtn:active,
    #comicBtn:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <header>
    <img src="mainlogo.png" alt="Main Logo" class="logo" />
    <h1>welcome to my site</h1>

    <button id="musicBtn" onclick="toggleMusic()">Music Toggle</button>

    <!-- Background music -->
    <audio id="bgMusic" loop>
      <source src="bg.mp3" type="audio/mpeg">
    </audio>

    <!-- Ring sound -->
    <audio id="ringSound">
      <source src="ring.wav" type="audio/wav">
    </audio>

    <!-- Comic music -->
    <audio id="comicMusic">
      <source src="Maigo - Springless - Topic (128k).mp3" type="audio/mpeg">
    </audio>
  </header>

  <main>
    <p>my name is Aaron Carter, i make games, animations and most importantly content!.</p>

    <div class="yt-container">
      <a href="https://www.youtube.com/@aaronthecarterreal" target="_blank" rel="noopener noreferrer" onclick="playRing()">
        <img src="ytlogo.png" alt="YouTube" class="yt-logo" />
      </a>

      <a href="https://bsky.app/profile/aaronthecarter.bsky.social" target="_blank" rel="noopener noreferrer" onclick="playRing()">
        <img src="Bluesky_Logo_White.svg.png" alt="Bluesky" class="yt-logo" />
      </a>

      <a href="mailto:aaronthecarter37@gmail.com?subject=Forum%20Sent%20from%20website%3A%20%22https%3A%2F%2Faaronthecarter.github.io%2Fhome.html%2F%22" target="_blank" rel="noopener noreferrer" onclick="playRing()">
        <img src="Gmail_Logo_White_512px.png" alt="Gmail" class="yt-logo" />
      </a>

      <img src="BUY MY MERCH COMING SOON!.png" alt="Coming Soon Merch" class="yt-logo" />
    </div>

    <div class="button-row">
      <img src="buttonye.png" alt="Game Link Button" id="gameBtn" />

      <img src="Untitled188_20260702190649.png"
           alt="Comic Button"
           id="comicBtn" />
    </div>
  </main>

  <script>
    let isPlaying = false;

    async function toggleMusic() {
      const music = document.getElementById("bgMusic");

      try {
        if (!isPlaying) {
          await music.play();
          isPlaying = true;
        } else {
          music.pause();
          isPlaying = false;
        }
      } catch (err) {
        alert("Click again to enable music!");
      }
    }

    function playRing() {
      const ring = document.getElementById("ringSound");
      ring.currentTime = 0;
      ring.play();
    }

    document.getElementById("gameBtn").addEventListener("click", function () {
      playRing();
      window.open("https://gamejolt.com/games/SonicTheHedgehogOrdeal/1059371", "_blank");
    });

    document.getElementById("comicBtn").addEventListener("click", function () {
      // Play ring
      playRing();

      // Play comic music
      const comicMusic = document.getElementById("comicMusic");
      comicMusic.currentTime = 0;
      comicMusic.play();

      // Open the comic
      window.open("Aaron%20The%20Carter%20(Issue%20%231)%20%5BWebsite%20Version%5D.pdf", "_blank");
    });
  </script>

</body>
</html>
